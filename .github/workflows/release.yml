name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Verify updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e '
            const key = process.env.KEY || "";
            if (!key) {
              console.error("::error::The TAURI_SIGNING_PRIVATE_KEY repository secret is missing. Add the single-line contents of src-tauri/.updater-key as a repository secret with that name, then re-run this workflow. Without it the updater artifacts cannot be signed.");
              process.exit(1);
            }
            if (/\s/.test(key)) {
              console.error("::error::TAURI_SIGNING_PRIVATE_KEY contains whitespace or a trailing newline. Paste the key as a single line with no line breaks.");
              process.exit(1);
            }
            const text = Buffer.from(key, "base64").toString("utf8");
            if (!text.includes("encrypted secret key")) {
              console.error("::error::TAURI_SIGNING_PRIVATE_KEY does not decode to a private key (expected \"encrypted secret key\" in the decoded comment). Did you paste src-tauri/.updater-key.pub by mistake?");
              process.exit(1);
            }
            console.log("Updater signing key looks valid.");
          '

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          VERSION="$VERSION" node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.version = version;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8")
              .replace(/^version = \".*\"/m, `version = \"${version}\"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);
            console.log(`Set version to ${version}`);
          '

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The key was generated with `tauri signer generate --ci`, i.e. it is
          # encrypted with an EMPTY password. In CI mode (CI=true is set by
          # GitHub Actions) tauri automatically falls back to an empty password
          # when TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set, so no password
          # secret is required here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Looji ${{ github.ref_name }}'
          releaseBody: 'Release ${{ github.ref_name }} of Looji. Download the installer for your platform from the assets below. The update system picks this release up automatically.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
