<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="Workmaster is a calm, focused workspace for planning and tracking projects."
    />
    <title>Workmaster</title>
    <style>
      /* Paint the page background before the app loads to avoid a white flash,
         matching the theme the OS is already in. */
      html {
        background-color: #f5f5f5;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background-color: #161619;
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
